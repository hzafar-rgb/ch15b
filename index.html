<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AQA A-Level Maths • Ch 15 Differentiation (50m) | Q1–Q11</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- KaTeX for crisp LaTeX mathematical rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3',
              900: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .katex-display {
      margin: 0.65em 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0;
    }
    .step-enter {
      animation: slideFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* Custom scrollbar for math blocks */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100 text-slate-900 selection:bg-indigo-100 selection:text-indigo-900">

  <!-- Ultra-Compact Dark Top Header & Question Jump Bar (Q1 to Q11) -->
  <header class="bg-slate-950 text-white border-b border-slate-800 px-3 py-1.5 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- Left: Compact Brand & Title -->
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-6 h-6 rounded bg-indigo-500 flex items-center justify-center text-white font-mono font-bold text-xs shadow-sm shrink-0">
          f'(x)
        </div>
        <h1 class="text-xs sm:text-sm font-bold text-white truncate">
          AQA A-Level Maths • Ch 15 Differentiation (50m)
        </h1>
      </div>

      <!-- Center: Direct Jump Buttons for Q1 through Q11 (No horizontal scroll) -->
      <nav aria-label="Question Navigation" class="order-3 lg:order-2 w-full lg:w-auto">
        <div id="question-nav-buttons" class="flex flex-wrap items-center gap-1">
          <!-- Dynamically populated by JS for Q1 to Q11 -->
        </div>
      </nav>

      <!-- Right: Mastery Badge -->
      <div class="flex items-center gap-2 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 order-2 lg:order-3 shrink-0">
        <span id="overall-progress-text" class="text-[11px] font-semibold text-slate-200">0 / 18 Parts Mastered</span>
        <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div id="overall-progress-bar" class="h-full bg-emerald-400 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-3">
    <!-- Secondary Per-Question Dark Banner -->
    <div id="question-banner" class="bg-slate-900 text-white px-4 py-2 rounded-lg mb-3 flex flex-wrap items-center justify-between gap-2 shadow border border-slate-800">
      <!-- Populated by JS -->
    </div>

    <!-- Sub-parts Container (All parts of the current question on one page) -->
    <div id="question-parts-container" class="space-y-5">
      <!-- Populated by JS -->
    </div>

    <!-- Bottom Pagination Controls -->
    <div class="mt-6 pt-4 border-t border-slate-200 flex items-center justify-between gap-4">
      <button id="prev-q-btn" onclick="changeQuestion(state.currentQuestionIndex - 1)" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 font-semibold text-xs sm:text-sm hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none shadow-sm transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Previous Question
      </button>

      <div id="bottom-page-indicator" class="text-xs sm:text-sm font-semibold text-slate-600">
        Question 1 of 11
      </div>

      <button id="next-q-btn" onclick="changeQuestion(state.currentQuestionIndex + 1)" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs sm:text-sm hover:bg-indigo-700 disabled:opacity-40 disabled:pointer-events-none shadow-sm transition">
        Next Question
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 mt-8 py-3">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs gap-2">
      <div>AQA A-Level Mathematics • End of Chapter 15 Test (Version B): Differentiation (Questions 1–11 • 50 Marks)</div>
      <div>Step-by-step worked solutions &amp; diagnostic multiple-choice coaching</div>
    </div>
  </footer>

  <!-- Application Data & Logic -->
  <script>
    // ============================================================================
    // SVG DIAGRAM GENERATORS (High-Precision Mathematical Plots)
    // ============================================================================
    function getQ1OriginalSVG(showOverlay = false) {
      // Cubic with local min at a < 0 (x=145, y=133) and local max at b > 0 (x=287, y=68)
      return `
      <div class="bg-slate-50 rounded-xl border border-slate-200 p-2.5 my-2">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Figure 1: Sketch of $y = f(x)$</span>
          <button onclick="toggleGraphHint('q1-orig')" class="text-[11px] font-semibold px-2 py-0.5 rounded-md ${showOverlay ? 'bg-indigo-600 text-white' : 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100'} border border-indigo-200 transition">
            ${showOverlay ? 'Hide Gradient & Concavity Overlay' : 'Show Gradient & Concavity Overlay'}
          </button>
        </div>
        <svg viewBox="0 0 460 205" class="w-full max-w-md mx-auto h-auto select-none">
          <defs>
            <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
            </marker>
          </defs>

          ${showOverlay ? `
            <!-- Shaded interval a < x < b where f'(x) > 0 -->
            <rect x="145" y="20" width="142" height="145" fill="#eef2ff" opacity="0.85" rx="4"/>
            <text x="216" y="36" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">Increasing: f'(x) &gt; 0</text>
          ` : ''}

          <!-- Axes -->
          <line x1="20" y1="165" x2="435" y2="165" stroke="#1e293b" stroke-width="1.8" marker-end="url(#axis-arrow)"/>
          <line x1="262" y1="198" x2="262" y2="14" stroke="#1e293b" stroke-width="1.8" marker-end="url(#axis-arrow)"/>

          <!-- Axis labels -->
          <text x="438" y="158" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">x</text>
          <text x="245" y="24" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">y</text>
          <text x="246" y="182" font-family="serif" font-style="italic" font-size="15" fill="#0f172a">O</text>

          <!-- Dashed vertical lines at x = a and x = b -->
          <line x1="145" y1="128" x2="145" y2="165" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,4"/>
          <line x1="287" y1="63" x2="287" y2="165" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,4"/>

          <!-- Labels a and b -->
          <text x="145" y="182" text-anchor="middle" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">a</text>
          <text x="287" y="182" text-anchor="middle" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">b</text>

          <!-- Smooth Cubic Curve y = f(x) -->
          <path d="M 35 40 C 65 105, 105 128, 145 128 C 195 128, 238 63, 287 63 C 335 63, 378 120, 405 192"
                fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>

          <!-- Curve label -->
          <text x="315" y="42" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">y = <tspan font-style="normal">f</tspan>(x)</text>

          ${showOverlay ? `
            <!-- Stationary point tangents & concavity badges -->
            <line x1="115" y1="128" x2="175" y2="128" stroke="#059669" stroke-width="2"/>
            <circle cx="145" cy="128" r="4.5" fill="#059669"/>
            <text x="145" y="147" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="700">Min: f''(a) &gt; 0</text>

            <line x1="257" y1="63" x2="317" y2="63" stroke="#dc2626" stroke-width="2"/>
            <circle cx="287" cy="63" r="4.5" fill="#dc2626"/>
            <text x="287" y="52" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="700">Max: f''(b) &lt; 0</text>
          ` : ''}
        </svg>
      </div>`;
    }

    function getQ1SimilarSVG(showOverlay = false) {
      // Similar Q1: Cubic y = g(x) with local MAX at x = p (p < 0, x=135, y=58) and local MIN at x = q (q > 0, x=305, y=128)
      return `
      <div class="bg-emerald-50/50 rounded-xl border border-emerald-200/80 p-2.5 my-2">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[11px] font-semibold text-emerald-800 uppercase tracking-wider">Similar Sketch: $y = g(x)$</span>
          <button onclick="toggleGraphHint('q1-sim')" class="text-[11px] font-semibold px-2 py-0.5 rounded-md ${showOverlay ? 'bg-emerald-600 text-white' : 'bg-white text-emerald-700 hover:bg-emerald-50'} border border-emerald-300 transition">
            ${showOverlay ? 'Hide Visual Hint' : 'Show Visual Hint'}
          </button>
        </div>
        <svg viewBox="0 0 460 205" class="w-full max-w-md mx-auto h-auto select-none">
          <defs>
            <marker id="axis-arrow-sim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
            </marker>
          </defs>

          ${showOverlay ? `
            <rect x="135" y="20" width="170" height="145" fill="#fef3c7" opacity="0.65" rx="4"/>
            <text x="220" y="36" text-anchor="middle" fill="#b45309" font-size="11" font-weight="700">Slope goes downhill: g'(x) &lt; 0</text>
          ` : ''}

          <!-- Axes -->
          <line x1="20" y1="165" x2="435" y2="165" stroke="#1e293b" stroke-width="1.8" marker-end="url(#axis-arrow-sim)"/>
          <line x1="225" y1="198" x2="225" y2="14" stroke="#1e293b" stroke-width="1.8" marker-end="url(#axis-arrow-sim)"/>

          <!-- Axis labels -->
          <text x="438" y="158" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">x</text>
          <text x="208" y="24" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">y</text>
          <text x="210" y="182" font-family="serif" font-style="italic" font-size="15" fill="#0f172a">O</text>

          <!-- Dashed vertical lines at x = p and x = q -->
          <line x1="135" y1="58" x2="135" y2="165" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,4"/>
          <line x1="305" y1="128" x2="305" y2="165" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,4"/>

          <!-- Labels p and q -->
          <text x="135" y="182" text-anchor="middle" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">p</text>
          <text x="305" y="182" text-anchor="middle" font-family="serif" font-style="italic" font-size="16" fill="#0f172a">q</text>

          <!-- Smooth Cubic Curve y = g(x) -->
          <path d="M 42 187 C 70 105, 100 58, 135 58 C 185 58, 255 128, 305 128 C 345 128, 382 90, 410 34"
                fill="none" stroke="#065f46" stroke-width="2.6" stroke-linecap="round"/>

          <text x="335" y="50" font-family="serif" font-style="italic" font-size="16" fill="#065f46">y = <tspan font-style="normal">g</tspan>(x)</text>

          ${showOverlay ? `
            <circle cx="135" cy="58" r="4.5" fill="#dc2626"/>
            <text x="135" y="48" text-anchor="middle" fill="#991b1b" font-size="10.5" font-weight="700">Max: g''(p) &lt; 0</text>
            <circle cx="305" cy="128" r="4.5" fill="#059669"/>
            <text x="305" y="146" text-anchor="middle" fill="#065f46" font-size="10.5" font-weight="700">Min: g''(q) &gt; 0</text>
          ` : ''}
        </svg>
      </div>`;
    }

    function getQ3OriginalSVG() {
      // Plot of y = e^(e^x) and tangent at (ln 2, e^2)
      return `
      <div class="bg-slate-50 rounded-xl border border-slate-200 p-2.5 my-2">
        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">
          Geometric Visualisation: $y = e^{e^x}$ and Tangent at $P(\\ln 2, e^2)$
        </div>
        <svg viewBox="0 0 440 205" class="w-full max-w-md mx-auto h-auto select-none">
          <defs>
            <marker id="q3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
            </marker>
          </defs>
          <!-- Grid lines -->
          <line x1="40" y1="172" x2="410" y2="172" stroke="#334155" stroke-width="1.6" marker-end="url(#q3-arrow)"/>
          <line x1="150" y1="196" x2="150" y2="14" stroke="#334155" stroke-width="1.6" marker-end="url(#q3-arrow)"/>
          <text x="415" y="176" font-family="serif" font-style="italic" font-size="14" fill="#1e293b">x</text>
          <text x="135" y="22" font-family="serif" font-style="italic" font-size="14" fill="#1e293b">y</text>
          <text x="136" y="188" font-family="serif" font-style="italic" font-size="13" fill="#1e293b">O</text>

          <!-- y-intercept (0, e) -->
          <circle cx="150" cy="142" r="3" fill="#475569"/>
          <text x="118" y="146" font-size="11" fill="#475569">(0, e)</text>

          <!-- Curve y = e^(e^x) -->
          <path d="M 45 158 C 100 154, 140 146, 175 132 C 215 114, 242 90, 260 66 C 272 50, 282 32, 290 16"
                fill="none" stroke="#4f46e5" stroke-width="2.6"/>
          <text x="296" y="32" font-size="12" font-weight="600" fill="#4338ca">y = e^(e^x)</text>

          <!-- Tangent line at P(248, 82) with slope 2e^2 -->
          <line x1="178" y1="188" x2="292" y2="16" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,3"/>
          <text x="298" y="88" font-size="11.5" font-weight="600" fill="#be123c">Tangent: m = 2e²</text>

          <!-- Dashed coordinates for P(ln 2, e^2) -->
          <line x1="248" y1="82" x2="248" y2="172" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
          <line x1="150" y1="82" x2="248" y2="82" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
          <text x="248" y="188" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">ln 2</text>
          <text x="134" y="86" text-anchor="end" font-size="11.5" font-weight="600" fill="#0f172a">e²</text>

          <!-- Point P -->
          <circle cx="248" cy="82" r="4.5" fill="#e11d48" stroke="#fff" stroke-width="1.5"/>
          <text x="256" y="76" font-size="11.5" font-weight="700" fill="#0f172a">P(ln 2, e²)</text>
        </svg>
      </div>`;
    }

    function getQ4bOriginalSVG() {
      // Sketch of a(t) = -2 csc^2(2t) for 5pi/8 <= t <= 7pi/8
      return `
      <div class="bg-slate-50 rounded-xl border border-slate-200 p-2.5 my-2">
        <div class="text-[11px] font-semibold text-indigo-700 uppercase tracking-wider mb-1">
          Required Sketch: $a(t) = -2\\csc^2(2t)$ for $\\frac{5\\pi}{8} \\le t \\le \\frac{7\\pi}{8}$
        </div>
        <svg viewBox="0 0 460 215" class="w-full max-w-lg mx-auto h-auto select-none">
          <defs>
            <marker id="q4-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
            </marker>
          </defs>

          <!-- Shaded negative region highlight -->
          <rect x="157" y="42" width="146" height="120" fill="#fef2f2" opacity="0.75"/>

          <!-- Axes: t-axis near top since a(t) < 0 -->
          <line x1="30" y1="42" x2="430" y2="42" stroke="#1e293b" stroke-width="1.8" marker-end="url(#q4-arrow)"/>
          <line x1="55" y1="198" x2="55" y2="14" stroke="#1e293b" stroke-width="1.8" marker-end="url(#q4-arrow)"/>
          <text x="436" y="46" font-family="serif" font-style="italic" font-size="15" fill="#0f172a">t</text>
          <text x="64" y="22" font-family="serif" font-style="italic" font-size="14" fill="#0f172a">a(t)</text>
          <text x="42" y="56" font-size="12" fill="#0f172a">0</text>

          <!-- Vertical asymptotes at t = pi/2 and t = pi -->
          <line x1="95" y1="22" x2="95" y2="196" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
          <line x1="365" y1="22" x2="365" y2="196" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
          <text x="95" y="35" text-anchor="middle" font-size="10.5" fill="#64748b">π/2</text>
          <text x="365" y="35" text-anchor="middle" font-size="10.5" fill="#64748b">π</text>

          <!-- Dashed coordinate guides for endpoints and maximum -->
          <line x1="157" y1="42" x2="157" y2="160" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
          <line x1="230" y1="42" x2="230" y2="100" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
          <line x1="303" y1="42" x2="303" y2="160" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>

          <!-- Horizontal level lines for a = -2 and a = -4 -->
          <line x1="55" y1="100" x2="230" y2="100" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3,3"/>
          <line x1="55" y1="160" x2="303" y2="160" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3,3"/>
          <text x="48" y="104" text-anchor="end" font-size="11.5" font-weight="600" fill="#0f172a">-2</text>
          <text x="48" y="164" text-anchor="end" font-size="11.5" font-weight="600" fill="#0f172a">-4</text>

          <!-- t-axis ticks -->
          <text x="157" y="33" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">5π/8</text>
          <text x="230" y="33" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">3π/4</text>
          <text x="303" y="33" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">7π/8</text>

          <!-- Ghost continuation towards asymptotes -->
          <path d="M 138 195 Q 148 177 157 160" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
          <path d="M 303 160 Q 312 177 322 195" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

          <!-- Active domain curve: inverted U-shape between (157, 160), max (230, 100), (303, 160) -->
          <path d="M 157 160 C 180 117, 204 100, 230 100 C 256 100, 280 117, 303 160"
                fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

          <!-- Key points -->
          <circle cx="157" cy="160" r="4" fill="#dc2626"/>
          <circle cx="230" cy="100" r="4.5" fill="#4f46e5" stroke="#fff" stroke-width="1.5"/>
          <circle cx="303" cy="160" r="4" fill="#dc2626"/>

          <!-- Annotations -->
          <text x="230" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">Max: (3π/4, -2)</text>
          <text x="152" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">(5π/8, -4)</text>
          <text x="308" y="176" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991b1b">(7π/8, -4)</text>
          <text x="230" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Entire curve lies below t-axis (-4 ≤ a(t) ≤ -2 &lt; 0)</text>
        </svg>
      </div>`;
    }

    function getQ4bSimilarSVG() {
      // Similar Q4b: Sketch of a(t) = 3 sec^2(3t) for pi/12 <= t <= pi/9

        </div>
        ${selectedOpt ? `
          <div class="mt-2 p-2.5 rounded-xl text-xs border ${selectedOpt.isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}">
            <span class="font-bold">${selectedOpt.key}:</span> ${selectedOpt.msg}
          </div>
        ` : ''}
      `;
    }

    function selectQ1OrigOption(key) {
      state.q1OrigSelection = key;
      renderQ1OrigInteractiveOptions();
      renderMath();
    }

    function toggleGraphHint(graphKey) {
      state.graphHints[graphKey] = !state.graphHints[graphKey];
      const origContainer = document.getElementById('svg-container-q1-orig');
      const simContainer = document.getElementById('svg-container-q1-sim');
      if (origContainer && graphKey === 'q1-orig') {
        origContainer.innerHTML = getQ1OriginalSVG(state.graphHints['q1-orig']);
        renderMath();
      }
      if (simContainer && graphKey === 'q1-sim') {
        simContainer.innerHTML = getQ1SimilarSVG(state.graphHints['q1-sim']);
        renderMath();
      }
    }

    function injectDynamicSVGs() {
      const q1Orig = document.getElementById('svg-container-q1-orig');
      if (q1Orig) q1Orig.innerHTML = getQ1OriginalSVG(state.graphHints['q1-orig']);

      const q1Sim = document.getElementById('svg-container-q1-sim');
      if (q1Sim) q1Sim.innerHTML = getQ1SimilarSVG(state.graphHints['q1-sim']);

      const q3Orig = document.getElementById('svg-container-q3-orig');
      if (q3Orig) q3Orig.innerHTML = getQ3OriginalSVG();

      const q6Orig = document.getElementById('svg-container-q6-orig');
      if (q6Orig) q6Orig.innerHTML = getQ6OriginalSVG();

      const q7Orig = document.getElementById('svg-container-q7-orig');
      if (q7Orig) q7Orig.innerHTML = getQ7OriginalSVG();

      const q8Orig = document.getElementById('svg-container-q8-orig');
      if (q8Orig) q8Orig.innerHTML = getQ8OriginalSVG();

      const q10Orig = document.getElementById('svg-container-q10-orig');
      if (q10Orig) q10Orig.innerHTML = getQ10OriginalSVG();

      const q11Orig = document.getElementById('svg-container-q11-orig');
      if (q11Orig) q11Orig.innerHTML = getQ11OriginalSVG();

      renderQ1OrigInteractiveOptions();
    }

    function getQuestionCompletionStatus(qObj) {
      const totalParts = qObj.parts.length;
      const completedParts = qObj.parts.filter(p => state.practiceState[p.partId].completed).length;
      return { totalParts, completedParts, isAllDone: completedParts === totalParts };
    }

    function updateOverallProgress() {
      let totalParts = 0;
      let completedParts = 0;
      questionsData.forEach(q => {
        q.parts.forEach(p => {
          totalParts++;
          if (state.practiceState[p.partId].completed) completedParts++;
        });
      });

      const pct = totalParts > 0 ? Math.round((completedParts / totalParts) * 100) : 0;
      document.getElementById('overall-progress-text').textContent = `${completedParts} / ${totalParts} Parts Mastered`;
      document.getElementById('overall-progress-bar').style.width = `${pct}%`;
    }

    function renderNavigation() {
      const navContainer = document.getElementById('question-nav-buttons');
      navContainer.innerHTML = QUESTIONS.map((q, idx) => {
        const isActive = idx === state.currentQuestionIndex;
        const status = getQuestionCompletionStatus(q);

        const baseClasses = "px-2.5 py-1 text-xs font-bold rounded transition flex items-center gap-1 border";
        const activeClasses = isActive
          ? "bg-indigo-600 text-white border-indigo-400 shadow-sm"
          : "bg-slate-900 text-slate-200 border-slate-800 hover:bg-slate-800 hover:text-white hover:border-slate-700";

        let badgeHTML = '';
        if (status.isAllDone) {
          badgeHTML = `<span class="inline-flex items-center justify-center w-3.5 h-3.5 rounded-full ${isActive ? 'bg-emerald-400 text-slate-950' : 'bg-emerald-500/20 text-emerald-400'} text-[10px] font-extrabold" title="All practice parts completed">✓</span>`;
        } else if (status.completedParts > 0) {
          badgeHTML = `<span class="text-[10px] px-1 rounded ${isActive ? 'bg-indigo-500 text-white' : 'bg-amber-500/20 text-amber-300'}">${status.completedParts}/${status.totalParts}</span>`;
        }

        return `
          <button onclick="changeQuestion(${idx})" class="${baseClasses} ${activeClasses}">
            <span>Q${q.number}</span>
            ${badgeHTML}
          </button>
        `;
      }).join('');

      document.getElementById('prev-q-btn').disabled = state.currentQuestionIndex === 0;
      document.getElementById('next-q-btn').disabled = state.currentQuestionIndex === QUESTIONS.length - 1;
      document.getElementById('bottom-page-indicator').textContent = `Question ${state.currentQuestionIndex + 1} of ${QUESTIONS.length}`;
    }

    function revealAllInCurrentQuestion() {
      const q = questionsData[state.currentQuestionIndex];
      q.parts.forEach(part => {
        state.revealedSolutionSteps[part.partId] = part.solutionSteps.length;
      });
      renderQuestionParts();
    }

    function resetCurrentQuestion() {
      const q = questionsData[state.currentQuestionIndex];
      if (q.number === 1) state.q1OrigSelection = null;
      q.parts.forEach(part => {
        state.revealedSolutionSteps[part.partId] = 0;
        state.practiceState[part.partId] = {
          unlockedStep: 0,
          selections: {},
          completed: false
        };
      });
      renderNavigation();
      renderQuestionBanner();
      renderQuestionParts();
      updateOverallProgress();
    }

    function renderQuestionBanner() {
      const q = QUESTIONS[state.currentQuestionIndex];
      const status = getQuestionCompletionStatus(q);
      const banner = document.getElementById('question-banner');

      const prevDisabled = state.currentQuestionIndex === 0 ? 'disabled opacity-40 pointer-events-none' : '';
      const nextDisabled = state.currentQuestionIndex === QUESTIONS.length - 1 ? 'disabled opacity-40 pointer-events-none' : '';

      banner.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 min-w-0">
          <span class="px-2 py-0.5 rounded text-xs font-extrabold bg-indigo-600 text-white">Q${q.number} of ${QUESTIONS.length}</span>
          <h2 class="text-sm sm:text-base font-extrabold text-white tracking-tight">${q.title}</h2>
          <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-400/30">${q.topicBadge}</span>
          <span class="px-2 py-0.5 rounded text-[11px] font-mono font-semibold bg-slate-800 text-slate-300 border border-slate-700">${q.totalMarks} ${q.totalMarks === 1 ? 'mark' : 'marks'}</span>
          ${status.isAllDone
            ? `<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">✓ Page Mastered</span>`
            : ''
          }
        </div>
        <div class="flex flex-wrap items-center gap-1.5 shrink-0">
          <button onclick="changeQuestion(state.currentQuestionIndex - 1)" ${prevDisabled} class="px-2.5 py-1 rounded text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
            ◀ Prev
          </button>
          <button onclick="changeQuestion(state.currentQuestionIndex + 1)" ${nextDisabled} class="px-2.5 py-1 rounded text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
            Next ▶
          </button>
          <button onclick="revealAllInCurrentQuestion()" class="px-2.5 py-1 rounded text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-sm">
            Reveal All Solutions
          </button>
          <button onclick="resetCurrentQuestion()" class="px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
            Reset Page
          </button>
        </div>
      `;
    }

    function renderPartWorkedSolution(part) {
      const revealedCount = state.revealedSolutionSteps[part.partId] || 0;
      const totalSteps = part.solutionSteps.length;

      const stepsHTML = part.solutionSteps.map((step, idx) => {
        if (idx >= revealedCount) return '';
        return `
          <div class="step-enter bg-white rounded-xl border border-indigo-200/90 p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-md border border-indigo-200">
                ${step.title}
              </span>
              <span class="text-xs font-mono font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">
                ${step.markTag}
              </span>
            </div>
            <div class="text-sm text-slate-800 leading-relaxed overflow-x-auto">
              ${step.content}
            </div>
            ${step.tip ? `
              <div class="mt-3 flex items-start gap-2 bg-amber-50/90 border border-amber-200/80 rounded-lg p-2.5 text-xs text-amber-900">
                <span class="font-bold shrink-0">💡 Examiner Tip:</span>
                <span>${step.tip}</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="mt-4 pt-4 border-t border-slate-200">
          <!-- Worked Solution Control Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Worked Solution</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                ${revealedCount} / ${totalSteps} steps shown
              </span>
            </div>

            <div class="flex items-center gap-1.5">
              <button
                onclick="revealNextSolutionStep('${part.partId}', ${totalSteps})"
                ${revealedCount >= totalSteps ? 'disabled' : ''}
                class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40 disabled:pointer-events-none shadow-sm transition">
                ${revealedCount === 0 ? 'Reveal Step 1' : 'Reveal Next Step'}
              </button>
              <button
                onclick="revealAllSolutionSteps('${part.partId}', ${totalSteps})"
                ${revealedCount >= totalSteps ? 'disabled' : ''}
                class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 disabled:opacity-40 disabled:pointer-events-none transition">
                Show All
              </button>
              <button
                onclick="resetSolutionSteps('${part.partId}')"
                ${revealedCount === 0 ? 'disabled' : ''}
                class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-40 disabled:pointer-events-none transition">
                Hide / Reset
              </button>
            </div>
          </div>

          <!-- Steps List or Placeholder -->
          ${revealedCount === 0 ? `
            <div class="rounded-xl border border-dashed border-slate-300 bg-slate-50/70 p-4 text-center text-xs text-slate-500">
              Click <strong>"Reveal Step 1"</strong> above to unveil the worked solution step by step, or try the <strong>Similar Question</strong> on the right first!
            </div>
          ` : `
            <div class="space-y-3">
              ${stepsHTML}
            </div>
          `}
        </div>
      `;
    }

    function renderPartSimilarPractice(part) {
      const pState = state.practiceState[part.partId];
      const totalSteps = part.mcqSteps.length;

      const mcqStepsHTML = part.mcqSteps.map((mcq, stepIdx) => {
        const isUnlocked = stepIdx <= pState.unlockedStep;
        const selection = pState.selections[stepIdx]; // { optionIdx, isCorrect }

        if (!isUnlocked) {
          return `
            <div class="rounded-xl border border-slate-200 bg-slate-100/70 p-3.5 flex items-center justify-between text-xs text-slate-500">
              <span class="font-semibold">${mcq.stepTitle}</span>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-200 text-slate-600 font-medium">
                🔒 Complete Step ${stepIdx} first
              </span>
            </div>
          `;
        }

        const optionsHTML = mcq.options.map((opt, optIdx) => {
          const isSelected = selection && selection.optionIdx === optIdx;
          let btnStyle = "bg-white hover:bg-slate-50 border-slate-200 text-slate-800";
          let badgeStyle = "bg-slate-100 text-slate-700 border-slate-300";
          let statusIcon = "";

          if (isSelected) {
            if (opt.isCorrect) {
              btnStyle = "bg-emerald-50/90 border-emerald-500 text-emerald-950 ring-1 ring-emerald-500";
              badgeStyle = "bg-emerald-600 text-white border-emerald-600";
              statusIcon = `<span class="ml-auto text-emerald-700 font-bold text-xs shrink-0">✓ Correct</span>`;
            } else {
              btnStyle = "bg-rose-50/90 border-rose-400 text-rose-950 ring-1 ring-rose-400";
              badgeStyle = "bg-rose-600 text-white border-rose-600";
              statusIcon = `<span class="ml-auto text-rose-700 font-bold text-xs shrink-0">✗ Try again</span>`;
            }
          }

          const optionLetter = String.fromCharCode(65 + optIdx);

          return `
            <button
              onclick="selectMCQOption('${part.partId}', ${stepIdx}, ${optIdx})"
              class="w-full text-left p-3 rounded-xl border transition flex items-start gap-3 ${btnStyle}">
              <span class="w-6 h-6 rounded-lg border text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${badgeStyle}">
                ${optionLetter}
              </span>
              <span class="text-sm leading-snug flex-1">${opt.label}</span>
              ${statusIcon}
            </button>
          `;
        }).join('');

        // Diagnostic feedback box if an option has been clicked for this step
        let feedbackHTML = '';
        if (selection !== undefined) {
          const chosenOpt = mcq.options[selection.optionIdx];
          if (chosenOpt.isCorrect) {
            feedbackHTML = `
              <div class="step-enter mt-3 p-3 rounded-xl bg-emerald-50 border border-emerald-300 text-xs text-emerald-950 flex items-start gap-2.5">
                <span class="w-5 h-5 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center shrink-0 mt-0.5">✓</span>
                <div class="flex-1 leading-relaxed">
                  <div class="font-bold text-emerald-900 mb-0.5">Correct Step!</div>
                  <div>${chosenOpt.feedback}</div>
                </div>
              </div>
            `;
          } else {
            feedbackHTML = `
              <div class="step-enter mt-3 p-3 rounded-xl bg-rose-50 border border-rose-300 text-xs text-rose-950 flex items-start gap-2.5">
                <span class="w-5 h-5 rounded-full bg-rose-600 text-white font-bold flex items-center justify-center shrink-0 mt-0.5">!</span>
                <div class="flex-1 leading-relaxed">
                  <div class="font-bold text-rose-900 mb-0.5">Diagnostic Feedback — Why this isn't quite right:</div>
                  <div>${chosenOpt.feedback}</div>
                </div>
              </div>
            `;
          }
        }

        return `
          <div class="step-enter bg-white rounded-xl border ${selection && selection.isCorrect ? 'border-emerald-300' : 'border-slate-200'} p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-800 bg-emerald-50 px-2.5 py-0.5 rounded-md border border-emerald-200">
                ${mcq.stepTitle}
              </span>
              ${selection && selection.isCorrect
                ? `<span class="text-xs font-bold text-emerald-700">Step Mastered ✓</span>`
                : `<span class="text-xs text-slate-400">Select an option</span>`
              }
            </div>
            <p class="text-sm font-semibold text-slate-900 mb-3">${mcq.question}</p>
            <div class="space-y-2">
              ${optionsHTML}
            </div>
            ${feedbackHTML}
          </div>
        `;
      }).join('');

      return `
        <div class="mt-4 pt-4 border-t border-emerald-200/70">
          <div class="flex items-center justify-between gap-2 mb-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-800">Guided Step-by-Step MCQ</span>
              ${pState.completed
                ? `<span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-600 text-white">Completed ★</span>`
                : `<span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">Step ${Math.min(pState.unlockedStep + 1, totalSteps)} of ${totalSteps}</span>`
              }
            </div>
            <button
              onclick="resetPracticePart('${part.partId}')"
              class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">
              Reset Practice
            </button>
          </div>

          <div class="space-y-3">
            ${mcqStepsHTML}
          </div>
        </div>
      `;
    }

    function renderQuestionParts() {
      const q = questionsData[state.currentQuestionIndex];
      const container = document.getElementById('question-parts-container');

      container.innerHTML = q.parts.map(part => {
        return `
          <section id="part-card-${part.partId}" class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <!-- Sub-part Header Bar -->
            <div class="bg-slate-900 text-white px-5 py-3 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="px-2.5 py-0.5 rounded-lg bg-indigo-500 text-white font-bold text-xs uppercase tracking-wider">
                  ${part.partLabel}
                </span>
                <span class="text-sm font-semibold text-slate-200">
                  Original Test Question vs. Guided Similar Question
                </span>
              </div>
              <span class="px-2.5 py-0.5 rounded-md bg-slate-800 text-indigo-300 font-mono text-xs font-semibold border border-slate-700">
                [${part.marks} ${part.marks === 1 ? 'mark' : 'marks'}]
              </span>
            </div>

            <!-- Two-Column Side-by-Side Split Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-200">
              <!-- LEFT COLUMN: Original Test Question & Step-by-Step Worked Solution -->
              <div class="p-5 sm:p-6 bg-white flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <span class="inline-flex items-center gap-1.5 text-xs font-extrabold uppercase tracking-wider text-indigo-700">
                      <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                      Original Test Question (${part.partLabel})
                    </span>
                    <span class="text-xs font-semibold text-slate-400">[${part.marks} ${part.marks === 1 ? 'mark' : 'marks'}]</span>
                  </div>
                  <div class="text-slate-900 text-sm sm:text-base leading-relaxed bg-slate-50/80 p-4 rounded-xl border border-slate-200/90">
                    ${part.originalPrompt}
                  </div>
                </div>

                <!-- Step-by-Step Worked Solution Area -->
                <div id="worked-solution-${part.partId}">
                  ${renderPartWorkedSolution(part)}
                </div>
              </div>

              <!-- RIGHT COLUMN: Similar Question & Diagnostic Step-by-Step MCQ -->
              <div class="p-5 sm:p-6 bg-emerald-50/25 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <span class="inline-flex items-center gap-1.5 text-xs font-extrabold uppercase tracking-wider text-emerald-800">
                      <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
                      Your Turn: Similar Question (${part.partLabel})
                    </span>
                    <span class="text-xs font-semibold text-emerald-700">[${part.marks} ${part.marks === 1 ? 'mark' : 'marks'}]</span>
                  </div>
                  <div class="text-slate-900 text-sm sm:text-base leading-relaxed bg-white p-4 rounded-xl border border-emerald-200/90 shadow-sm">
                    ${part.similarPrompt}
                  </div>
                </div>

                <!-- Interactive Step-by-Step Multiple Choice Area -->
                <div id="similar-practice-${part.partId}">
                  ${renderPartSimilarPractice(part)}
                </div>
              </div>
            </div>
          </section>
        `;
      }).join('');

      injectDynamicSVGs();
      renderMath();
    }

    // ============================================================================
    // EVENT HANDLERS
    // ============================================================================
    function changeQuestion(newIndex) {
      if (newIndex < 0 || newIndex >= questionsData.length) return;
      state.currentQuestionIndex = newIndex;
      renderNavigation();
      renderQuestionBanner();
      renderQuestionParts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function findPartById(partId) {
      for (const q of questionsData) {
        for (const p of q.parts) {
          if (p.partId === partId) return p;
        }
      }
      return null;
    }

    function revealNextSolutionStep(partId, totalSteps) {
      const current = state.revealedSolutionSteps[partId] || 0;
      if (current < totalSteps) {
        state.revealedSolutionSteps[partId] = current + 1;
        const part = findPartById(partId);
        document.getElementById(`worked-solution-${partId}`).innerHTML = renderPartWorkedSolution(part);
        renderMath();
      }
    }

    function revealAllSolutionSteps(partId, totalSteps) {
      state.revealedSolutionSteps[partId] = totalSteps;
      const part = findPartById(partId);
      document.getElementById(`worked-solution-${partId}`).innerHTML = renderPartWorkedSolution(part);
      renderMath();
    }

    function resetSolutionSteps(partId) {
      state.revealedSolutionSteps[partId] = 0;
      const part = findPartById(partId);
      document.getElementById(`worked-solution-${partId}`).innerHTML = renderPartWorkedSolution(part);
      renderMath();
    }

    function selectMCQOption(partId, stepIdx, optionIdx) {
      const part = findPartById(partId);
      if (!part) return;

      const pState = state.practiceState[partId];
      const chosenOption = part.mcqSteps[stepIdx].options[optionIdx];

      pState.selections[stepIdx] = {
        optionIdx,
        isCorrect: chosenOption.isCorrect
      };

      // If correct, unlock the next step or mark part completed
      if (chosenOption.isCorrect) {
        if (stepIdx === pState.unlockedStep && stepIdx < part.mcqSteps.length - 1) {
          pState.unlockedStep = stepIdx + 1;
        }
        // Check if all steps in this part are now answered correctly
        const allCorrect = part.mcqSteps.every((_, idx) => pState.selections[idx] && pState.selections[idx].isCorrect);
        if (allCorrect) {
          pState.completed = true;
        }
      }

      document.getElementById(`similar-practice-${partId}`).innerHTML = renderPartSimilarPractice(part);
      renderNavigation();
      renderQuestionBanner();
      updateOverallProgress();
      renderMath();
    }

    function resetPracticePart(partId) {
      const part = findPartById(partId);
      if (!part) return;

      state.practiceState[partId] = {
        unlockedStep: 0,
        selections: {},
        completed: false
      };

      document.getElementById(`similar-practice-${partId}`).innerHTML = renderPartSimilarPractice(part);
      renderNavigation();
      renderQuestionBanner();
      updateOverallProgress();
      renderMath();
    }

    // Initialize app on load
    window.addEventListener('DOMContentLoaded', () => {
      renderNavigation();
      renderQuestionBanner();
      renderQuestionParts();
      updateOverallProgress();
    });
  </script>
</body>
</html>
